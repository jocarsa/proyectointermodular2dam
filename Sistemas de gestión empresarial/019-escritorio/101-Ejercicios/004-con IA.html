<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JSON Viewer: Table • Tree • Mindmap • Sunburst</title>
  <style>
    :root{
      /* Light, professional theme */
      --bg: #f6f7fb;
      --card: #ffffff;
      --card2: #fbfbfd;
      --border: #e7e9f2;
      --text: #111827;
      --muted: #6b7280;

      --accent: #2563eb;   /* blue */
      --accent2:#16a34a;   /* green */

      --radius: 16px;
      --shadow: 0 16px 48px rgba(16,24,40,.10);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 15% 0%, rgba(37,99,235,.10), transparent 55%),
        radial-gradient(1000px 600px at 90% 10%, rgba(22,163,74,.08), transparent 55%),
        var(--bg);
      min-height:100vh;
    }

    .wrap{
      max-width: 1200px;
      margin: 0 auto;
      padding: 26px 18px 38px;
    }

    header{
      display:flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .title{
      display:flex;
      align-items:center;
      gap: 12px;
    }
    .badge{
      width: 40px; height: 40px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(37,99,235,.95), rgba(22,163,74,.80));
      box-shadow: 0 10px 26px rgba(37,99,235,.18);
    }
    h1{
      margin:0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .2px;
    }
    .sub{
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .controls{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
      justify-content:flex-end;
    }

    .btn{
      appearance:none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      display:flex;
      gap: 8px;
      align-items:center;
      transition: transform .06s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
      user-select:none;
    }
    .btn:hover{
      border-color: #d6daea;
      box-shadow: 0 10px 22px rgba(16,24,40,.06);
      transform: translateY(-1px);
    }
    .btn:active{ transform: translateY(0px); }
    .btn.active{
      border-color: rgba(37,99,235,.45);
      background: rgba(37,99,235,.06);
      box-shadow: 0 14px 30px rgba(37,99,235,.10);
    }

    .panel{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .panelHead{
      display:flex;
      gap: 14px;
      align-items:center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--card2);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .meta{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
    }
    .pill{
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      font-family: var(--mono);
      font-size: 12px;
      color: #334155;
    }

    .content{
      padding: 16px;
    }

    /* -------- Table -------- */
    table{
      width:100%;
      border-collapse: collapse;
      overflow:hidden;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    thead th{
      text-align:left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #475569;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      padding: 12px 12px;
    }
    tbody td{
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      background: #fff;
    }
    tbody tr:hover td{
      background: #f9fafb;
    }
    .num{
      text-align:right;
      font-family: var(--mono);
      white-space: nowrap;
      color: #0f172a;
    }
    .path{
      font-family: var(--mono);
      font-size: 12px;
      color: #64748b;
    }
    .nameCell{
      display:flex;
      gap:10px;
      align-items:center;
      min-width: 240px;
    }
    .dot{
      width:10px;height:10px;border-radius:3px;
      background: rgba(37,99,235,.90);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
      flex: 0 0 auto;
    }

    /* -------- Tree -------- */
    .tree{
      --line: #d7dbea;
      --node: #ffffff;
      --nodeHover: #f8fafc;
      padding: 6px;
    }
    .tree ul{
      list-style:none;
      margin: 0;
      padding-left: 20px;
      position: relative;
    }
    .tree ul:before{
      content:"";
      position:absolute;
      top:0; bottom:0; left:8px;
      width:1px;
      background: var(--line);
    }
    .tree li{
      position:relative;
      padding: 6px 0 6px 18px;
    }
    .tree li:before{
      content:"";
      position:absolute;
      top: 18px; left: 8px;
      width: 12px; height:1px;
      background: var(--line);
    }
    .node{
      display:inline-flex;
      gap: 8px;
      align-items:center;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--node);
      transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .node:hover{ background: var(--nodeHover); border-color: #d7dbea; box-shadow: 0 10px 22px rgba(16,24,40,.06); }
    .node .label{ font-weight: 750; }
    .node .value{
      font-family: var(--mono);
      color: #0f172a;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #f8fafc;
      white-space: nowrap;
    }

    /* -------- Mindmap (true radial) -------- */
    .mmWrap{
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
      overflow:hidden;
    }
    .mmTop{
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
    }
    .mmCanvas{
      width: 100%;
      height: 560px;
      display:block;
      background:
        radial-gradient(circle at 50% 45%, rgba(37,99,235,.06), transparent 55%),
        #ffffff;
    }
    @media (max-width: 820px){
      .mmCanvas{ height: 520px; }
    }

    /* -------- Sunburst -------- */
    .sunWrap{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
      align-items: start;
    }
    @media (max-width: 980px){
      .sunWrap{ grid-template-columns: 1fr; }
    }
    .sunCard{
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 16px;
      padding: 12px;
      overflow:hidden;
    }
    .sunSvg{
      width: 100%;
      height: auto;
      display:block;
    }
    .legend{
      display:flex;
      flex-direction: column;
      gap: 10px;
    }
    .legend .hint{
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    .legend .box{
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 16px;
      padding: 12px;
    }
    .kv{
      display:grid;
      grid-template-columns: 120px 1fr;
      gap: 8px 10px;
      font-size: 13px;
    }
    .kv div:nth-child(odd){
      color: #64748b;
      font-family: var(--mono);
      font-size: 12px;
    }
    .kv div:nth-child(even){
      color: #0f172a;
      overflow-wrap: anywhere;
    }

    .toast{
      position: fixed;
      left: 18px;
      bottom: 16px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(17,24,39,.92);
      border: 1px solid rgba(255,255,255,.18);
      color: rgba(255,255,255,.90);
      font-size: 13px;
      backdrop-filter: blur(6px);
      display:none;
      max-width: min(640px, calc(100vw - 36px));
    }
    .toast.show{ display:block; }

    .error{
      border: 1px solid rgba(220,38,38,.35);
      background: rgba(220,38,38,.06);
      color: #111827;
      padding: 12px 14px;
      border-radius: 14px;
      line-height: 1.35;
    }
    .error code{ font-family: var(--mono); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <div class="badge"></div>
        <div>
          <h1>JSON Viewer</h1>
          <div class="sub">Table • Tree • Mindmap • Sunburst</div>
        </div>
      </div>
      <div class="controls" role="tablist" aria-label="View selector">
        <button class="btn active" data-view="table" role="tab" aria-selected="true">📋 Table</button>
        <button class="btn" data-view="tree" role="tab" aria-selected="false">🌿 Tree</button>
        <button class="btn" data-view="mindmap" role="tab" aria-selected="false">🧠 Mindmap</button>
        <button class="btn" data-view="sunburst" role="tab" aria-selected="false">🌀 Sunburst</button>
      </div>
    </header>

    <section class="panel">
      <div class="panelHead">
        <div class="meta">
          <span class="pill">source: <span id="srcLabel">modelo.json</span></span>
          <span class="pill">leaves: <span id="leafCount">—</span></span>
          <span class="pill">total: <span id="totalSum">—</span></span>
        </div>
        <div class="meta">
          <span class="pill">hover to inspect</span>
        </div>
      </div>
      <div class="content" id="app">Loading…</div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SOURCE = "modelo.json";

    const app = document.getElementById("app");
    const leafCountEl = document.getElementById("leafCount");
    const totalSumEl = document.getElementById("totalSum");
    const toast = document.getElementById("toast");

    // Node: { name, children?: Node[], value?: number, path?: string[], depth?: number, angle?: number }
    function buildTreeFromAny(input, name = "root") {
      const node = { name, children: [] };

      if (Array.isArray(input)) {
        for (const item of input) {
          if (item && typeof item === "object" && "nombre" in item && "cantidad" in item) {
            node.children.push({ name: String(item.nombre), value: Number(item.cantidad) || 0 });
          } else {
            node.children.push(buildTreeFromAny(item, "item"));
          }
        }
      } else if (input && typeof input === "object") {
        for (const [k, v] of Object.entries(input)) {
          node.children.push(buildTreeFromAny(v, k));
        }
      } else {
        node.value = Number(input) || 0;
      }

      if (node.children.length === 0 && node.value == null) node.value = 0;
      return node;
    }

    function computeSums(node) {
      if (node.children && node.children.length) {
        let sum = 0;
        for (const c of node.children) sum += computeSums(c);
        node.value = sum;
        return sum;
      }
      node.value = Number(node.value) || 0;
      return node.value;
    }

    function assignPaths(node, path = []) {
      node.path = [...path, node.name];
      if (node.children) node.children.forEach(c => assignPaths(c, node.path));
    }

    function assignDepths(node, depth = 0) {
      node.depth = depth;
      if (node.children) node.children.forEach(c => assignDepths(c, depth + 1));
    }

    function collectLeaves(node, out = []) {
      if (node.children && node.children.length) node.children.forEach(c => collectLeaves(c, out));
      else out.push(node);
      return out;
    }

    function fmt(n) { return (Number(n) || 0).toFixed(0); }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    let toastTimer = null;
    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1400);
    }
    function hideToast(){
      clearTimeout(toastTimer);
      toast.classList.remove("show");
    }

    // ---------------- Views ----------------
    function setView(viewName, tree) {
      document.querySelectorAll(".btn").forEach(b => {
        const on = b.dataset.view === viewName;
        b.classList.toggle("active", on);
        b.setAttribute("aria-selected", on ? "true" : "false");
      });

      app.innerHTML = "";
      if (viewName === "table") renderTable(tree);
      else if (viewName === "tree") renderTree(tree);
      else if (viewName === "mindmap") renderMindmap(tree);
      else if (viewName === "sunburst") renderSunburst(tree);
    }

    // 1) TABLE
    function renderTable(tree) {
      const leaves = collectLeaves(tree, []);
      const table = document.createElement("table");

      const thead = document.createElement("thead");
      thead.innerHTML = `
        <tr>
          <th style="width:48%">Name</th>
          <th>Path</th>
          <th style="width:14%; text-align:right">Amount</th>
        </tr>`;
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      for (const leaf of leaves) {
        const tr = document.createElement("tr");

        const nameTd = document.createElement("td");
        nameTd.innerHTML = `
          <div class="nameCell">
            <span class="dot"></span>
            <span>${escapeHtml(leaf.name)}</span>
          </div>
        `;

        const pathTd = document.createElement("td");
        const p = (leaf.path || []).slice(1, -1).join(" / ");
        pathTd.innerHTML = `<span class="path">${escapeHtml(p || "—")}</span>`;

        const amountTd = document.createElement("td");
        amountTd.className = "num";
        amountTd.textContent = fmt(leaf.value);

        tr.appendChild(nameTd);
        tr.appendChild(pathTd);
        tr.appendChild(amountTd);

        tr.addEventListener("mouseenter", () => showToast(`${p ? p + " / " : ""}${leaf.name} → ${fmt(leaf.value)}`));
        tr.addEventListener("mouseleave", hideToast);

        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      app.appendChild(table);
    }

    // 2) TREE
    function renderTree(tree) {
      const wrap = document.createElement("div");
      wrap.className = "tree";
      const ul = document.createElement("ul");
      ul.appendChild(treeLi(tree, true));
      wrap.appendChild(ul);
      app.appendChild(wrap);
    }

    function treeLi(node, isRoot = false) {
      const li = document.createElement("li");
      const div = document.createElement("div");
      div.className = "node";
      div.innerHTML = `
        <span class="label">${escapeHtml(isRoot ? "root" : node.name)}</span>
        <span class="value">${fmt(node.value)}</span>
      `;
      div.addEventListener("mouseenter", () => showToast(`${(node.path || []).slice(1).join(" / ")} → ${fmt(node.value)}`));
      div.addEventListener("mouseleave", hideToast);

      li.appendChild(div);

      if (node.children && node.children.length) {
        const ul = document.createElement("ul");
        for (const c of node.children) ul.appendChild(treeLi(c, false));
        li.appendChild(ul);
      }
      return li;
    }

    // 3) MINDMAP (true radial with circles + connectors)
    function renderMindmap(tree) {
      const wrap = document.createElement("div");
      wrap.className = "mmWrap";

      const top = document.createElement("div");
      top.className = "mmTop";
      top.innerHTML = `
        <div>Radial mindmap (node position based on leaf ordering)</div>
        <div class="pill">tip: hover nodes</div>
      `;

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.classList.add("mmCanvas");
      svg.setAttribute("viewBox", "0 0 1100 560");
      svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

      // Layout
      const cx = 550, cy = 280;
      const radiusStep = 110;

      // Assign depths + angles (leaf-ordered)
      assignDepths(tree, 0);
      const leaves = collectLeaves(tree, []);
      const leafAngles = new Map();
      const twoPi = Math.PI * 2;

      // Even spacing around circle; rotate slightly so it looks balanced
      leaves.forEach((leaf, i) => {
        const a = (i / Math.max(1, leaves.length)) * twoPi - Math.PI / 2;
        leafAngles.set(leaf, a);
      });

      // Post-order: internal node angle = average of child angles
      function assignAngles(node) {
        if (!node.children || node.children.length === 0) {
          node.angle = leafAngles.get(node) ?? (-Math.PI/2);
          return node.angle;
        }
        const angles = node.children.map(assignAngles);

        // Average angle on circle (vector average) to avoid wrap issues
        let sx = 0, sy = 0;
        for (const a of angles) { sx += Math.cos(a); sy += Math.sin(a); }
        node.angle = Math.atan2(sy, sx);
        return node.angle;
      }
      assignAngles(tree);

      // Determine max depth
      const maxDepth = (function getMaxDepth(n){
        if (!n.children || n.children.length === 0) return n.depth || 0;
        return Math.max(...n.children.map(getMaxDepth));
      })(tree);

      // Node positions
      function pos(node){
        const d = node.depth || 0;
        const r = d * radiusStep;
        const a = node.angle ?? (-Math.PI/2);
        return {
          x: cx + r * Math.cos(a),
          y: cy + r * Math.sin(a)
        };
      }

      // Background rings (subtle)
      for (let d = 1; d <= maxDepth; d++){
        const ring = document.createElementNS("http://www.w3.org/2000/svg","circle");
        ring.setAttribute("cx", cx);
        ring.setAttribute("cy", cy);
        ring.setAttribute("r", d * radiusStep);
        ring.setAttribute("fill", "none");
        ring.setAttribute("stroke", "rgba(17,24,39,.06)");
        ring.setAttribute("stroke-width", "1");
        svg.appendChild(ring);
      }

      // Draw connectors
      function drawEdges(node){
        if (!node.children) return;
        const p0 = pos(node);
        for (const c of node.children){
          const p1 = pos(c);

          const line = document.createElementNS("http://www.w3.org/2000/svg","line");
          line.setAttribute("x1", p0.x);
          line.setAttribute("y1", p0.y);
          line.setAttribute("x2", p1.x);
          line.setAttribute("y2", p1.y);
          line.setAttribute("stroke", "rgba(17,24,39,.18)");
          line.setAttribute("stroke-width", "2");
          line.setAttribute("stroke-linecap", "round");
          svg.appendChild(line);

          drawEdges(c);
        }
      }
      drawEdges(tree);

      // Draw nodes (circles + labels)
      function drawNodes(node){
        const p = pos(node);
        const isRoot = (node.depth === 0);
        const isLeaf = (!node.children || node.children.length === 0);

        const g = document.createElementNS("http://www.w3.org/2000/svg","g");
        g.style.cursor = "default";

        const circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
        circle.setAttribute("cx", p.x);
        circle.setAttribute("cy", p.y);
        circle.setAttribute("r", isRoot ? 34 : (isLeaf ? 20 : 24));
        circle.setAttribute("fill", isRoot ? "rgba(37,99,235,.95)" : "#ffffff");
        circle.setAttribute("stroke", isRoot ? "rgba(37,99,235,.18)" : "rgba(17,24,39,.18)");
        circle.setAttribute("stroke-width", isRoot ? "0" : "2");
        circle.setAttribute("filter", "none");

        const halo = document.createElementNS("http://www.w3.org/2000/svg","circle");
        halo.setAttribute("cx", p.x);
        halo.setAttribute("cy", p.y);
        halo.setAttribute("r", (isRoot ? 34 : (isLeaf ? 20 : 24)) + 8);
        halo.setAttribute("fill", "rgba(37,99,235,.08)");
        halo.setAttribute("stroke", "none");
        halo.style.opacity = "0";
        halo.style.transition = "opacity .12s ease";

        const label = document.createElementNS("http://www.w3.org/2000/svg","text");
        label.setAttribute("x", p.x);
        label.setAttribute("y", p.y + 4);
        label.setAttribute("text-anchor", "middle");
        label.setAttribute("font-size", isRoot ? "13" : "12");
        label.setAttribute("font-weight", isRoot ? "800" : "700");
        label.setAttribute("fill", isRoot ? "rgba(255,255,255,.96)" : "rgba(17,24,39,.92)");
        label.textContent = isRoot ? "root" : node.name;

        // Small value pill under non-root
        let valueText = null;
        if (!isRoot){
          valueText = document.createElementNS("http://www.w3.org/2000/svg","text");
          valueText.setAttribute("x", p.x);
          valueText.setAttribute("y", p.y + (isLeaf ? 36 : 40));
          valueText.setAttribute("text-anchor", "middle");
          valueText.setAttribute("font-size", "11");
          valueText.setAttribute("font-family", "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono','Courier New', monospace");
          valueText.setAttribute("fill", "rgba(17,24,39,.62)");
          valueText.textContent = fmt(node.value);
        }

        // Hover interactions
        const hoverIn = () => {
          halo.style.opacity = "1";
          const pth = (node.path || []).slice(1).join(" / ");
          showToast(`${pth || "root"} → ${fmt(node.value)}`);
        };
        const hoverOut = () => { halo.style.opacity = "0"; hideToast(); };

        g.addEventListener("mouseenter", hoverIn);
        g.addEventListener("mouseleave", hoverOut);

        // Append in correct order (halo behind)
        g.appendChild(halo);
        g.appendChild(circle);
        g.appendChild(label);
        if (valueText) g.appendChild(valueText);

        svg.appendChild(g);

        if (node.children) node.children.forEach(drawNodes);
      }
      drawNodes(tree);

      wrap.appendChild(top);
      wrap.appendChild(svg);
      app.appendChild(wrap);
    }

    // 4) SUNBURST (unchanged; kept simple and clean)
    function renderSunburst(tree) {
      const outer = document.createElement("div");
      outer.className = "sunWrap";

      const card = document.createElement("div");
      card.className = "sunCard";

      const side = document.createElement("div");
      side.className = "legend";
      side.innerHTML = `
        <div class="hint">
          Sunburst rings represent depth in the JSON. Segment size represents summed amounts.
          Hover a segment to inspect.
        </div>
        <div class="box">
          <div class="kv">
            <div>path</div><div id="sbPath">—</div>
            <div>value</div><div id="sbValue">—</div>
            <div>depth</div><div id="sbDepth">—</div>
          </div>
        </div>
      `;

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 720 520");
      svg.classList.add("sunSvg");

      const cx = 360, cy = 260;
      const ring = 46;
      const padAngle = 0.006;

      const maxDepth = (function getMaxDepth(n, d=0){
        if (!n.children || n.children.length === 0) return d;
        return Math.max(...n.children.map(c => getMaxDepth(c, d+1)));
      })(tree, 0);

      const arcs = [];
      partitionAngles(tree, 0, Math.PI * 2, 0, arcs);

      const bg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      bg.setAttribute("cx", cx);
      bg.setAttribute("cy", cy);
      bg.setAttribute("r", (maxDepth + 1) * ring + 6);
      bg.setAttribute("fill", "rgba(17,24,39,.02)");
      bg.setAttribute("stroke", "rgba(17,24,39,.08)");
      bg.setAttribute("stroke-width", "1");
      svg.appendChild(bg);

      for (const a of arcs) {
        if (a.depth === 0) continue;
        const start = a.start + padAngle;
        const end = a.end - padAngle;
        if (end <= start) continue;

        const r0 = a.depth * ring;
        const r1 = r0 + ring * 0.92;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", arcPath(cx, cy, r0, r1, start, end));

        const hue = (a.depth * 55 + hash(a.name) % 120) % 360;
        path.setAttribute("fill", `hsla(${hue}, 78%, 52%, .76)`);
        path.setAttribute("stroke", "rgba(0,0,0,.18)");
        path.setAttribute("stroke-width", "0.6");
        path.style.cursor = "pointer";

        path.addEventListener("mouseenter", () => {
          const p = (a.node.path || []).slice(1).join(" / ");
          document.getElementById("sbPath").textContent = p || "—";
          document.getElementById("sbValue").textContent = fmt(a.node.value);
          document.getElementById("sbDepth").textContent = String(a.depth);
          showToast(`${p} → ${fmt(a.node.value)}`);
          path.setAttribute("fill", `hsla(${hue}, 88%, 60%, .92)`);
        });
        path.addEventListener("mouseleave", () => {
          hideToast();
          path.setAttribute("fill", `hsla(${hue}, 78%, 52%, .76)`);
        });

        svg.appendChild(path);
      }

      const center = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const c1 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c1.setAttribute("cx", cx); c1.setAttribute("cy", cy); c1.setAttribute("r", ring * 0.92);
      c1.setAttribute("fill", "rgba(37,99,235,.10)");
      c1.setAttribute("stroke", "rgba(37,99,235,.22)");
      c1.setAttribute("stroke-width", "1");
      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.setAttribute("x", cx); t.setAttribute("y", cy + 6);
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("font-size", "14");
      t.setAttribute("font-weight", "800");
      t.setAttribute("fill", "rgba(17,24,39,.78)");
      t.textContent = "root";
      center.appendChild(c1);
      center.appendChild(t);
      svg.appendChild(center);

      card.appendChild(svg);
      outer.appendChild(card);
      outer.appendChild(side);
      app.appendChild(outer);
    }

    function partitionAngles(node, start, end, depth, out) {
      out.push({ node, name: node.name, start, end, depth });
      if (!node.children || node.children.length === 0) return;

      let a = start;
      const span = end - start;
      const total = node.value || 1;

      for (const c of node.children) {
        const frac = (c.value || 0) / total;
        const next = a + span * frac;
        partitionAngles(c, a, next, depth + 1, out);
        a = next;
      }
    }

    function arcPath(cx, cy, r0, r1, a0, a1) {
      const p0 = polar(cx, cy, r1, a0);
      const p1 = polar(cx, cy, r1, a1);
      const p2 = polar(cx, cy, r0, a1);
      const p3 = polar(cx, cy, r0, a0);
      const large = (a1 - a0) > Math.PI ? 1 : 0;

      return [
        `M ${p0.x.toFixed(3)} ${p0.y.toFixed(3)}`,
        `A ${r1.toFixed(3)} ${r1.toFixed(3)} 0 ${large} 1 ${p1.x.toFixed(3)} ${p1.y.toFixed(3)}`,
        `L ${p2.x.toFixed(3)} ${p2.y.toFixed(3)}`,
        `A ${r0.toFixed(3)} ${r0.toFixed(3)} 0 ${large} 0 ${p3.x.toFixed(3)} ${p3.y.toFixed(3)}`,
        "Z"
      ].join(" ");
    }

    function polar(cx, cy, r, a) {
      return { x: cx + r * Math.cos(a - Math.PI / 2), y: cy + r * Math.sin(a - Math.PI / 2) };
    }

    function hash(s){
      let h = 0;
      for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
      return h;
    }

    // ---------------- Boot ----------------
    (async function init(){
      document.getElementById("srcLabel").textContent = SOURCE;

      try{
        const res = await fetch(SOURCE, { cache: "no-store" });
        if(!res.ok) throw new Error(`HTTP ${res.status} fetching ${SOURCE}`);
        const json = await res.json();

        const tree = buildTreeFromAny(json, "root");
        computeSums(tree);
        assignPaths(tree, []);
        assignDepths(tree, 0);

        const leaves = collectLeaves(tree, []);
        leafCountEl.textContent = String(leaves.length);
        totalSumEl.textContent = fmt(tree.value);

        document.querySelectorAll(".btn").forEach(btn => {
          btn.addEventListener("click", () => setView(btn.dataset.view, tree));
        });

        setView("mindmap", tree); // default to the requested view
        document.querySelectorAll(".btn").forEach(b => {
          const on = b.dataset.view === "mindmap";
          b.classList.toggle("active", on);
          b.setAttribute("aria-selected", on ? "true" : "false");
        });

      } catch (err){
        app.innerHTML = `
          <div class="error">
            Could not load <code>${escapeHtml(SOURCE)}</code>.<br/>
            ${escapeHtml(err.message || String(err))}
            <div style="margin-top:10px;color:#64748b;font-size:13px">
              Ensure <code>modelo.json</code> is served by a web server (not opened via <code>file://</code>),
              and the file is in the same folder as this HTML.
            </div>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
