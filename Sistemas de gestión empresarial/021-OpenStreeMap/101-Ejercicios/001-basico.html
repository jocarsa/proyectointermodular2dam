<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>OpenStreetMap – Demo básico</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // Crear el mapa
  const map = L.map('map').setView([39.5014318, -0.4098094], 13); // Valencia

  // Capa OpenStreetMap
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Marcador
  L.marker([39.5014318, -0.4098094])
    .addTo(map)
    .bindPopup('Instituto CEAC')
    .openPopup();
</script>

</body>
</html>
